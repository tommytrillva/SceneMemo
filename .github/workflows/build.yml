name: Build SceneMemo

on:
  push:
    branches: ['*']
  pull_request:
    branches: ['main']
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -A x64 -DCI=ON
        timeout-minutes: 20

      - name: Build
        run: cmake --build build --config Release --parallel
        timeout-minutes: 30

      - name: List artifacts
        run: |
          dir build\SceneMemo_artefacts\Release\VST3 /s
          dir build\SceneMemo_artefacts\Release\Standalone /s

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: SceneMemo-VST3-Windows
          path: build/SceneMemo_artefacts/Release/VST3/SceneMemo.vst3/**/*
          retention-days: 90

      - name: Upload Standalone
        uses: actions/upload-artifact@v4
        with:
          name: SceneMemo-Standalone-Windows
          path: build/SceneMemo_artefacts/Release/Standalone/SceneMemo.exe
          retention-days: 90

  build-macos:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64" -DCI=ON
        timeout-minutes: 20

      - name: Build
        run: cmake --build build --config Release --parallel
        timeout-minutes: 30

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: SceneMemo-VST3-macOS
          path: build/SceneMemo_artefacts/Release/VST3/SceneMemo.vst3/**/*
          retention-days: 90

      - name: Upload AU
        uses: actions/upload-artifact@v4
        with:
          name: SceneMemo-AU-macOS
          path: build/SceneMemo_artefacts/Release/AU/SceneMemo.component/**/*
          retention-days: 90

      - name: Upload Standalone
        uses: actions/upload-artifact@v4
        with:
          name: SceneMemo-Standalone-macOS
          path: build/SceneMemo_artefacts/Release/Standalone/SceneMemo.app/**/*
          retention-days: 90

  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libgl-dev libfreetype-dev libxcomposite-dev \
            libxext-dev libxfixes-dev libxrender-dev

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DCI=ON
        timeout-minutes: 20

      - name: Build
        run: cmake --build build --config Release --parallel
        timeout-minutes: 30

      - name: Run tests
        run: ./build/tests/SceneMemoTests

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: SceneMemo-VST3-Linux
          path: build/SceneMemo_artefacts/Release/VST3/SceneMemo.vst3/**/*
          retention-days: 90
